name: PDF parser measurement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-measurement:
    name: Bounded synthetic parser diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Measure bounded synthetic parser cases
        run: pnpm test:pdf-parser-security
      - name: Upload content-free measurement report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdfmason-parser-measurement-${{ github.sha }}
          path: tmp/parser-security/report.json
          if-no-files-found: error
          retention-days: 14
