[package]
name = "pdfmason-desktop"
version = "0.0.0"
description = "PDFMason for Windows foundation shell"
authors = ["PDFMason development"]
edition = "2024"
rust-version = "1.98.0"
license = "UNLICENSED"
publish = false

[[example]]
name = "verify_updater_artifact"
test = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = { version = "=2.7.2", features = [] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
time = { version = "=0.3.55", features = ["formatting"] }
uuid = { version = "=1.25.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell"] }
zeroize = "=1.9.0"

[dev-dependencies]
minisign = "=0.9.1"
minisign-verify = "=0.2.5"
