packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  # Reviewed donation-only postinstall; no build is required or permitted.
  tesseract.js: false

catalog:
  '@axe-core/playwright': 4.13.0
  '@cantoo/pdf-lib': 2.9.1
  '@supabase/ssr': 0.12.4
  '@supabase/supabase-js': 2.112.3
  '@types/node': 24.13.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.2.4
  aws4fetch: 1.0.20
  pdfjs-dist: 6.2.108
  react: 19.3.1
  react-dom: 19.2.8
  stripe: 22.5.0
  typescript: 6.0.3
  vitest: 4.1.11
  zod: 4.4.3
  tesseract.js: 7.0.0

catalogMode: strict
linkWorkspacePackages: false
preferWorkspacePackages: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - supabase

# Keep every direct and transitive consumer on the maintained pako 2 line.
overrides:
  pako: 2.2.0
  source-map-js: 1.2.2
  tesseract.js-core: 7.0.0
  # Node >=22.13 supplies fetch; Tesseract 7 already prefers it in both Node
  # adapters. Drop only its unused legacy fallback, not another consumer's fetch.
  'tesseract.js@7.0.0>node-fetch': '-'

# Exact, reviewed security patches only; see checkpoint 058. No wildcard age exemption.
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
